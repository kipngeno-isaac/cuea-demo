name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: cuea-devops-web

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Image Tag
      id: vars
      run: |
        echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Configure insecure registry
      run: |
        echo '{"insecure-registries":["${{ secrets.REGISTRY_URL }}"]}' | \
        sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker

    - name: Login to Custom Registry
      run: |
        echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login \
        ${{ secrets.REGISTRY_URL }} \
        -u "${{ secrets.REGISTRY_USERNAME }}" \
        --password-stdin

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} .

    - name: Tag Latest
      run: |
        docker tag \
        ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
        ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

    - name: Push Image Tag
      run: |
        docker push ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

    - name: Push Latest Tag
      run: |
        docker push ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
